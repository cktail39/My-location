<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدونتي</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.7;
    }

    header {
      background-color: #000000;
      color: #ffffff;
      border-bottom: 1px solid #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      background-color: #000000;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2rem;
    }

    #search {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.95rem;
      outline: none;
      min-width: 180px;
    }

    #search::placeholder {
      color: #ffffff;
    }

    #view {
      flex: 1;
      background-color: #000000;
      color: #ffffff;
      padding: 20px 18px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    #view h1,
    #view h2,
    #view h3,
    #view p,
    #view a,
    #view li,
    #view span,
    #view div {
      background-color: #000000;
      color: #ffffff;
    }

    #view a {
      text-decoration: underline;
    }

    .msg {
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      padding: 24px 12px;
      font-size: 1rem;
    }

    footer {
      background-color: #000000;
      color: #ffffff;
      border-top: 1px solid #ffffff;
      text-align: center;
      padding: 12px 18px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="#" id="home" class="brand">📝 مدونتي</a>
    <input id="search" type="search" placeholder="بحث...">
  </header>

  <main id="view"><p class="msg">جارٍ التحميل...</p></main>

  <footer>© مدونتي</footer>

  <script src="script.js"></script>
</body>
</html>
